backend:
  name: github
  repo: "LucasHeinemann/moebelbau"
  branch: react_app"
  base_url: https://68d2622c3dd6840008387b16--thriving-kulfi-1e9970.netlify.app
  auth_endpoint: api/auth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "config"
    label: "Konfiguration"
    delete: false
    editor:
      preview: false
    files:
      - file: "public/config.json"
        label: "Website-Konfiguration"
        name: "site_config"
        fields:
          - { label: "Über mich", name: "about_me", widget: "text" }
          - label: "Projekte"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "description", widget: "text" }
              - { label: "Bilder", name: "pictures", widget: "list", field: { label: "Bild", name: "image", widget: "image" } }
              - { label: "Hintergrundfarbe", name: "background_color", widget: "string" }
